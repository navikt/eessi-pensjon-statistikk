buildscript {
    ext {
        kotlinVersion = '2.4.10'
        springBootVersion = '4.1.0'
        springKafkaVersion = '4.1.0'
        archunitVersion = '1.5.0'
        tokenSupportVersion = '6.0.11'
        jacksonModuleKotlinVersion = '2.22.2'

    }

    repositories {
        maven {
            url "https://maven.pkg.github.com/navikt/maven-release"
            credentials {
                username = "token"
                password = "$System.env.GITHUB_TOKEN"
            }
        }
    }
}


plugins {
    id "org.springframework.boot" version "$springBootVersion"
    id "io.spring.dependency-management" version "1.1.7"
    id "org.jetbrains.kotlin.jvm" version "$kotlinVersion"
    id "org.jetbrains.kotlin.plugin.spring" version "$kotlinVersion"
    id "org.jetbrains.kotlin.plugin.allopen" version "$kotlinVersion"
    id "io.github.ben-manes.versions" version "0.61.0"
}

apply from: "buildSrc/ep-module.gradle"

group = 'no.nav.eessi.pensjon'

dependencies {
    //eessi pensjon libs
    implementation("no.nav.eessi.pensjon:ep-logging:3.0.46")
    implementation("no.nav.eessi.pensjon:ep-eux:3.0.85")
    implementation("no.nav.eessi.pensjon:ep-metrics:3.0.34")

    // Spring-boot BOM-fil spesifiserer versjoner for Spring Boot-avhengigheter
    implementation(platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}"))
    implementation("org.springframework.boot:spring-boot-actuator")
    implementation("org.springframework.boot:spring-boot-starter-web")
    implementation("org.springframework.boot:spring-boot-starter-aspectj")
    implementation("org.springframework.boot:spring-boot-starter-actuator")
    implementation("org.springframework.boot:spring-boot-starter-validation")

    implementation "org.springframework.kafka:spring-kafka:$springKafkaVersion"
    implementation("org.springframework.retry:spring-retry:2.0.13")

    // Spring Framework BOM-fil overstyrer så vi får siste patch-versjon av Spring Framework
    implementation(platform("org.springframework:spring-framework-bom:7.0.8"))

    implementation("org.yaml:snakeyaml:2.6") // Pga https://security.snyk.io/package/maven/org.yaml:snakeyaml

    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonModuleKotlinVersion}"
    implementation("com.fasterxml.jackson.module:jackson-module-kotlin:${jacksonModuleKotlinVersion}")

    implementation 'org.jetbrains.kotlin:kotlin-reflect'

    implementation("org.apache.httpcomponents.client5:httpclient5:5.6.4")

    //GCP
    implementation("com.google.cloud:google-cloud-storage:2.71.0")

    // Logging
    implementation("tools.jackson.core:jackson-core:3.2.2")
    implementation("net.logstash.logback:logstash-logback-encoder:9.0")
    constraints {
        implementation("tools.jackson.core:jackson-databind:3.1.4") {
            because("CVE-2026-54512 and CVE-2026-54513")
        }
    }
    configurations { all*.exclude group: 'commons-logging', module: 'commons-logging' }
    implementation("org.slf4j:jcl-over-slf4j:2.0.18")

    //Auth
    implementation("no.nav.security:token-client-spring:${tokenSupportVersion}")
    implementation("no.nav.security:token-validation-spring:${tokenSupportVersion}")
    implementation("no.nav.security:token-validation-jaxrs:${tokenSupportVersion}")

    //test
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude module: 'junit'
        exclude module: "mockito-core"
        exclude module: "junit-vintage-engine"
    }
    testImplementation("io.mockk:mockk:1.14.11")
    testImplementation("com.ninja-squad:springmockk:5.0.1")
    testImplementation('org.pac4j:spring-webmvc-pac4j:8.0.3')
    testImplementation("org.springframework.boot:spring-boot-starter-webmvc-test")

    testImplementation "org.springframework.kafka:spring-kafka-test:$springKafkaVersion"
    testImplementation("org.junit.jupiter:junit-jupiter:6.1.3")
    testImplementation("org.mock-server:mockserver-netty:7.5.0") {
        exclude module: 'junit'
    }

    // Architecture tests
    testImplementation ("com.tngtech.archunit:archunit:${archunitVersion}")

}

test {
    // set heap size for the test JVM(s)
    minHeapSize = "128m"
    maxHeapSize = "512m"

    // set JVM arguments for the test JVM(s)
    failFast = true
    testLogging {
        exceptionFormat "full"
        events "started", "skipped", "passed", "failed"
        showStandardStreams true
    }
}
